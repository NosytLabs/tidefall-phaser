name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ci
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidefall-visual-audit
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
