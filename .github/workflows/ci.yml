name: CI

# Cost containment: start checks explicitly from Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ci
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tidefall-visual-audit
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
