<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tidefall — Pixel Art Fishing RPG</title>
  <meta name="description" content="Tidefall is a cozy 2D pixel art fishing RPG. Explore the River, Lake, and Sea, catch 44 fish species, and build your fishing village.">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="author" content="Nosyt Labs">
  <meta property="og:title" content="Tidefall — Pixel Art Fishing RPG">
  <meta property="og:description" content="A cozy 2D pixel art fishing RPG with 44 fish species, a day/night cycle, and three fishing biomes.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./favicon.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tidefall — Pixel Art Fishing RPG">
  <meta name="twitter:description" content="A cozy 2D pixel art fishing RPG with 44 fish species and three fishing biomes.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: monospace; }
    body { display: flex; justify-content: center; align-items: center; }
    #game-container { width: 100vw; height: 100dvh; }
    #game-container canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #88ccff; background: #1a1a2e; font-size: 16px; text-align: center; z-index: 10; }
    #loading .spinner { width: 30px; height: 30px; border: 3px solid #333; border-top-color: #88ccff; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #loading .spinner { animation: none; } }
  </style>
</head>
<body>
  <main id="game-container" aria-label="Tidefall game"></main>
  <div id="loading" role="status" aria-live="polite"><div><div class="spinner" aria-hidden="true"></div><span>Loading Tidefall…</span></div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
